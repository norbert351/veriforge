# VeriForge — Render blueprint (BOT Chain Builder Challenge #2, AI x RWA).
# Deploy: Render dashboard > "New +" > "Blueprint" > connect github.com/norbert351/veriforge.
# Dual-chain: BOT mainnet (677) + Bohr testnet (968), mainnet default.
# The API + web can switch chains at runtime (web toggle passes ?chainId / the
# x402 gate resolves the chain the buyer paid on). Both chains are hardcoded in
# src/chains.ts; the env vars below tune the defaults.

services:
  # ---------- API (Fastify, x402 + AI gate + issuance pipeline) ----------
  - type: web
    name: veriforge-api
    runtime: node
    repo: https://github.com/norbert351/veriforge
    rootDir: apps/api
    buildCommand: npm install && npm run build
    startCommand: node dist/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: BOT_CHAIN_ID
        value: '677'
      # BOT mainnet (677)
      - key: BOT_MAINNET_RPC
        value: https://rpc.botchain.ai
      - key: BOT_MAINNET_USDT
        value: '0xaBabc7Ddc03e501d190C676BF3d92ef0e6e87a3C'
      - key: BOT_MAINNET_BOTSCAN_URL
        value: https://scan.botchain.ai
      - key: BOT_MAINNET_BOTSCAN_API
        value: https://scan.botchain.ai/api
      # Bohr testnet (968)
      - key: BOT_TESTNET_RPC
        value: https://rpc.bohr.life
      - key: BOT_TESTNET_USDT
        value: '0x75edC9335175Fc0552D51D48439F229c10420fe3'
      - key: BOT_TESTNET_BOTSCAN_URL
        value: https://scan.bohr.life
      - key: BOT_TESTNET_BOTSCAN_API
        value: https://scan.bohr.life/api
      - key: X402_PAY_TO
        value: '0x73b16058d57a6337060677496d4A8e97A9554539'
      - key: GEMINI_MODEL
        value: gemini-flash-latest
      # Secrets — Render prompts for these at blueprint creation.
      - key: VERIFIER_PRIVATE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  # ---------- Web (Next.js standalone) — netlify is the live web, this is a fallback ----------
  - type: web
    name: veriforge-web
    runtime: node
    repo: https://github.com/norbert351/veriforge
    rootDir: apps/web
    # Standalone builds omit .next/static and public/ — copy both into the
    # standalone tree or the page renders but never hydrates (images 404 too).
    buildCommand: npm install && npm run build && cp -r .next/static .next/standalone/apps/web/.next/static && mkdir -p .next/standalone/apps/web/public && cp -r public/images .next/standalone/apps/web/public/
    startCommand: node .next/standalone/apps/web/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: '22'
      # The web calls the API directly (Netlify does not honor Next rewrites).
      - key: NEXT_PUBLIC_API_URL
        value: https://veriforge-5w80.onrender.com
      # BOT mainnet (677) — default network (dedicated env names)
      - key: NEXT_PUBLIC_BOT_MAINNET_NAME
        value: BOT Chain Mainnet
      - key: NEXT_PUBLIC_BOT_MAINNET_RPC
        value: https://rpc.botchain.ai
      - key: NEXT_PUBLIC_BOT_MAINNET_USDT
        value: '0xaBabc7Ddc03e501d190C676BF3d92ef0e6e87a3C'
      - key: NEXT_PUBLIC_BOT_MAINNET_BOTSCAN_URL
        value: https://scan.botchain.ai
      # Bohr testnet (968) — offered by the toggle
      - key: NEXT_PUBLIC_BOHR_NAME
        value: BOT Chain Testnet (Bohr)
      - key: NEXT_PUBLIC_BOHR_RPC
        value: https://rpc.bohr.life
      - key: NEXT_PUBLIC_BOHR_USDT
        value: '0x75edC9335175Fc0552D51D48439F229c10420fe3'
      - key: NEXT_PUBLIC_BOHR_BOTSCAN_URL
        value: https://scan.bohr.life
